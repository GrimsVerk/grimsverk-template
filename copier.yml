# Copier configuration for the GrimsVerk project template.
# Only the contents of `template/` are rendered into generated projects.

_min_copier_version: "9.4.0"
_subdirectory: template
# Only files ending in `.jinja` are rendered; everything else is copied
# verbatim. Set explicitly (it matches Copier's default) so that files
# carrying literal brace-like text — e.g. docs/idea-to-design-doc.md — are
# copied untouched rather than parsed as templates.
_templates_suffix: .jinja

project_name:
  type: str
  help: Human-readable project name (e.g. "My App")

project_slug:
  type: str
  help: Machine-friendly name, used for the repo, package, and paths
  default: "{{ project_name | lower | replace(' ', '-') }}"
  # The slug is not just the repo name: `package_name` and `app_name` below are
  # derived from it, so it has to survive becoming a Python identifier and a
  # Swift type name. The default slugifier only lowercases and swaps spaces for
  # dashes, so "My App 2.0" would sail through as `my-app-2.0` and render a
  # package called `my_app_2.0` that Python cannot import. Catch it at the
  # prompt, where it costs one retype.
  validator: >-
    {% if not project_slug | regex_search('^[a-z][a-z0-9]*(-[a-z0-9]+)*$') %}
    project_slug must be lowercase letters, digits, and single dashes, starting
    with a letter (e.g. my-app). Got: "{{ project_slug }}". It becomes the Python
    package "{{ project_slug | replace('-', '_') }}" and the Swift type
    "{{ project_slug | replace('-', ' ') | title | replace(' ', '') }}", and both
    must be valid identifiers.
    {% endif %}

language:
  type: str
  help: Primary language / platform
  choices:
    - python
    - swift-ios

description:
  type: str
  help: One-line project description
  default: ""

# NOTE — there is deliberately no `license` question, and this is not an
# oversight to be "fixed". Generated projects ship no LICENSE file and no
# `license` field in package metadata: every project is assessed on its own
# terms, by the owner, at the point licensing actually matters (publication,
# distribution, accepting outside contributions). A template-chosen default
# would silently attach terms to every project that never revisits the choice,
# which is worse than shipping nothing. Do not re-add this question or emit a
# license anywhere. The same rule is stated for coding agents in
# template/AGENTS.md.jinja under "Licensing".

auto_merge:
  type: bool
  help: >-
    Auto-merge PRs when all required checks pass (CI + the LLM review gate)?
    true for most repos; choose false for anything real people download or that
    touches payments, secrets, or user data — those keep a human merge.
  default: true

code_owner:
  type: str
  help: >-
    GitHub handle that owns the merge gates in CODEOWNERS (a user like @you or a
    team like @org/team). Changes to CI, the review check, pre-commit, and
    CODEOWNERS require this owner's review — even under auto-merge.
  # GitHub silently ignores CODEOWNERS lines whose owner does not parse — the
  # file stays valid, the rule simply never binds, and the gate paths quietly
  # become writable by anything that passes CI. A shape check cannot confirm the
  # handle exists, but it catches the common misses: a bare username with no @,
  # an email address, a trailing slash.
  validator: >-
    {% if not code_owner %}
    code_owner is required: the CODEOWNERS gate is ignored by GitHub without a
    real @user or @org/team.
    {% elif not code_owner | regex_search('^@[A-Za-z0-9](-?[A-Za-z0-9])*(/[A-Za-z0-9._-]+)?$') %}
    code_owner must look like @user or @org/team (leading @, no trailing slash).
    Got: "{{ code_owner }}". GitHub ignores CODEOWNERS entries it cannot resolve,
    which disables the gate silently rather than erroring.
    {% endif %}

# Computed values — never asked, derived from the answers above.
package_name:
  type: str
  when: false
  default: "{{ project_slug | replace('-', '_') }}"

app_name:
  type: str
  when: false
  default: "{{ project_slug | replace('-', ' ') | title | replace(' ', '') }}"
