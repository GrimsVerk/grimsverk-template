# Copier configuration. Only template/ is rendered; only *.jinja files are templated.
_min_copier_version: "9.4.0"
_subdirectory: template
_templates_suffix: .jinja
# Owned by the project after the first render: `copier update` leaves them alone.
_skip_if_exists:
  - next-steps.md
  - README.md
  - docs/VISION.md
  - docs/DESIGN.md
  - docs/DECISIONS.md
  - docs/BACKLOG.md

# Defaults to the folder name you gave copier. It is asked (not computed) because
# copier only records asked answers, and `copier update` renders into a temp dir
# whose name would otherwise replace the project name.
project_name:
  type: str
  help: Project name? (Enter = folder name)
  default: >-
    {{ _copier_conf.dst_path.name
       if not _copier_conf.dst_path.name.startswith('copier.')
       else '' }}
  validator: >-
    {% if not project_name | regex_search('^[a-z][a-z0-9]*([_-][a-z0-9]+)*$') %}
    "{{ project_name }}" must be lowercase letters, digits, _ or -, starting with
    a letter (it becomes the Python package name), e.g. find_best_mobo.
    {% endif %}

language:
  type: str
  help: Which language?
  choices:
    - python
    - swift-ios

description:
  type: str
  help: One-line description?
  default: ""

# No license question on purpose: the owner picks a license per repo
# (see ~/code/CLAUDE.md). Generated projects ship no LICENSE.

# Computed, never asked.
package_name:
  type: str
  when: false
  default: "{{ project_name | replace('-', '_') }}"

app_name:
  type: str
  when: false
  default: "{{ project_name | replace('-', ' ') | replace('_', ' ') | title | replace(' ', '') }}"
