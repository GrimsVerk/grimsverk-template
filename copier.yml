# Copier configuration for the GrimsVerk project template.
# Only the contents of `template/` are rendered into generated projects.

_min_copier_version: "9.4.0"
_subdirectory: template
# Only files ending in `.jinja` are rendered; everything else is copied
# verbatim. Set explicitly (it matches Copier's default) so that files
# carrying literal brace-like text — e.g. docs/idea-to-design-doc.md — are
# copied untouched rather than parsed as templates.
_templates_suffix: .jinja

project_name:
  type: str
  help: Human-readable project name (e.g. "My App")

project_slug:
  type: str
  help: Machine-friendly name, used for the repo, package, and paths
  default: "{{ project_name | lower | replace(' ', '-') }}"

language:
  type: str
  help: Primary language / platform
  choices:
    - python
    - swift-ios

description:
  type: str
  help: One-line project description
  default: ""

license:
  type: str
  help: License (SPDX identifier)
  default: MIT
  choices:
    - MIT
    - Apache-2.0
    - GPL-3.0-or-later

auto_merge:
  type: bool
  help: >-
    Auto-merge PRs when all required checks pass (CI + the LLM review gate)?
    true for most repos; choose false for anything real people download or that
    touches payments, secrets, or user data — those keep a human merge.
  default: true

code_owner:
  type: str
  help: >-
    GitHub handle that owns the merge gates in CODEOWNERS (a user like @you or a
    team like @org/team). Changes to CI, the review check, pre-commit, and
    CODEOWNERS require this owner's review — even under auto-merge.
  validator: >-
    {% if not code_owner %}code_owner is required: the CODEOWNERS gate is
    ignored by GitHub without a real @user or @org/team.{% endif %}

# Computed values — never asked, derived from the answers above.
package_name:
  type: str
  when: false
  default: "{{ project_slug | replace('-', '_') }}"

app_name:
  type: str
  when: false
  default: "{{ project_slug | replace('-', ' ') | title | replace(' ', '') }}"
