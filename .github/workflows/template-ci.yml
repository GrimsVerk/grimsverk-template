name: Template CI

# Checks for this template repo itself, then tags the release. Copier uses the
# latest v* tag, not main, so an untagged merge reaches no project. Bump, over all
# commits since the last tag: patch by default; any "feat:" -> minor; any "feat!:"
# or "BREAKING CHANGE" -> major.
# Generated projects get their own workflows from template/.github/workflows/.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: template-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: copier.yml
      - run: uv tool install copier==9.19.1
      - name: Install actionlint
        run: |
          curl -sSfL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: shellcheck
        run: shellcheck template/scripts/*.sh tests/*.sh
      - name: actionlint (this repo)
        run: actionlint
      - name: Render both project types and check them
        run: tests/test-render.sh

  tag:
    needs: check
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compute and push the next tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if existing="$(git tag --points-at HEAD --list 'v*' | head -1)" && [ -n "$existing" ]; then
            echo "HEAD is already tagged as $existing."
            if gh release view "$existing" >/dev/null 2>&1; then
              echo "Release $existing already exists — nothing to do."
            else
              echo "Tag $existing has no release; creating it."
              gh release create "$existing" \
                --title "$existing" \
                --generate-notes \
                --latest=true
            fi
            exit 0
          fi

          latest="$(git tag -l 'v*' --sort=-v:refname | head -1)"
          if [ -z "$latest" ]; then
            next="v0.1.0"
            echo "No existing tags; starting at $next."
          else
            # Every commit since the last tag counts: a rebase merge lands several.
            subjects="$(git log --pretty=%s "$latest..HEAD")"
            bodies="$(git log --pretty=%B "$latest..HEAD")"
            echo "Latest tag: $latest"
            echo "Commits since: $(git rev-list --count "$latest..HEAD")"

            major="$(echo "${latest#v}" | cut -d. -f1)"
            minor="$(echo "${latest#v}" | cut -d. -f2)"
            patch="$(echo "${latest#v}" | cut -d. -f3)"

            if echo "$subjects" | grep -qE '^[a-z]+(\([^)]*\))?!:' \
               || echo "$bodies" | grep -qE 'BREAKING[ -]CHANGE'; then
              major=$((major + 1)); minor=0; patch=0; bump="major"
            elif echo "$subjects" | grep -qE '^feat(\([^)]*\))?:'; then
              minor=$((minor + 1)); patch=0; bump="minor"
            else
              patch=$((patch + 1)); bump="patch"
            fi
            next="v${major}.${minor}.${patch}"
            echo "Bump: $bump -> $next"
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$next" -m "Release $next

          $(git log -1 --pretty=%s)"
          git push origin "$next"

          gh release create "$next" \
            --title "$next" \
            --generate-notes \
            --latest=true

          echo "Tagged and released $next" >> "$GITHUB_STEP_SUMMARY"

